name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser scripts
        run: |
          for file in static/local-console/*.js; do node --check "$file"; done
          node tests/test_dashboard_ui.cjs
          node tests/test_connection_ui.cjs
          node tests/test_account_concurrency_ui.cjs
          node tests/test_account_columns_ui.cjs
          node tests/test_tokens_concurrency_ui.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py api chatgpt gateway utils scripts tests
      - run: python -m unittest discover -s tests -p 'test_*.py'

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 · Chat2API 本地工作区</title>
  <link rel="stylesheet" href="/static/local-console/console.css?v=20261021">
  <script src="/static/local-console/ui.js?v=20261021" defer></script>
  <script src="/static/local-console/login.js?v=20261021" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="brand"><span class="brand-mark" aria-hidden="true">C2</span><span>Chat2API<span class="brand-subtitle">本地工作区</span></span></div>
    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-intro">
        <p class="eyebrow">LOCAL WORKSPACE</p>
        <h1 id="login-title">登录工作区</h1>
        <p class="login-description">管理账号额度与调度，测试 ChatGPT 反代响应。</p>
      </div>
      <form id="login-form">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" value="admin" autocomplete="username" required maxlength="80" autofocus>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <div class="password-control">
            <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" aria-describedby="password-hint">
            <button id="password-toggle" class="button button-quiet" type="button" aria-controls="password" aria-pressed="false" aria-label="显示密码">显示</button>
          </div>
          <p id="password-hint" class="field-hint">使用部署时提供的本地管理密码。</p>
        </div>
        <p id="login-error" class="notice notice-error" role="alert" hidden></p>
        <button id="login-submit" class="button button-primary button-full" type="submit">登录工作区 <span aria-hidden="true">→</span></button>
      </form>
    </section>
    <p class="login-footer"><span class="status-dot" aria-hidden="true"></span>本地部署 · 仅在当前设备访问</p>
    <noscript><p class="notice notice-error">请启用 JavaScript 后登录。</p></noscript>
  </main>
</body>
</html>

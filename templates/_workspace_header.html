<header class="topbar">
  <div class="topbar-inner">
    <a class="brand brand-link" href="/playground" aria-label="Chat2API 本地工作区">
      <span class="brand-mark" aria-hidden="true">C2</span>
      <span>Chat2API<span class="brand-subtitle">本地工作区</span></span>
    </a>
    <nav class="workspace-nav" aria-label="工作区导航">
      <a href="/playground" class="nav-link"{% if active_page == 'playground' %} aria-current="page"{% endif %}>
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8 4 4-4 4M14 16h3"/><rect x="3" y="4" width="18" height="16" rx="3"/></svg>
        <span>测试台</span>
      </a>
      <a href="/accounts" class="nav-link"{% if active_page == 'accounts' %} aria-current="page"{% endif %}>
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7m7 7V4m7 16V9"/><path d="M3 20h18"/></svg>
        <span>账号与额度</span>
      </a>
      <a href="/tokens" class="nav-link"{% if active_page == 'tokens' %} aria-current="page"{% endif %}>
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg>
        <span>导入凭据</span>
      </a>
    </nav>
    <div class="topbar-actions">
      {% if show_user|default(false) %}<span class="user-label" id="current-user">管理员</span>{% endif %}
      <button class="button button-quiet" id="{{ logout_id }}" type="button">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4m6-13 5 5-5 5m-6-5h11"/></svg>
        <span>退出</span>
      </button>
    </div>
  </div>
</header>
